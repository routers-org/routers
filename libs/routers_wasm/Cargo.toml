[package]
name = "routers_wasm"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "WebAssembly Component for the Routers map-matching engine"
repository = "https://github.com/routers-org/routers"

[lib]
name = "routers_wasm"
# `cdylib` is the wasm component; `rlib` keeps the pure core testable on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
routers_transition = { path = "../routers_transition", version = "0.3.5", default-features = false }
routers_codec = { path = "../routers_codec", version = "0.2.2", default-features = false, features = ["osm"] }
routers_shard = { path = "../routers_shard", version = "0.2.5", default-features = false, features = ["osm"] }
routers_network = { workspace = true }

geo = { workspace = true }
wit-bindgen = "0.46"

[dev-dependencies]
routers_fixtures = { workspace = true }
wkt = { workspace = true }
wasmtime = "36"
wasmtime-wasi = "36"

[[example]]
name = "wasmtime_host"
required-features = []

[lints]
workspace = true
