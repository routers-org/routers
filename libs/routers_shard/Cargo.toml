[package]
name = "routers_shard"
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Sharding Primitives for Routers"
repository = "https://github.com/routers-org/routers"

[dependencies]
routers_network = { workspace = true }
# Path dep (not `workspace = true`) so `default-features = false` is allowed —
# lets a wasm build drop codec's `parallel`/`mimalloc`. Re-enabled via features.
routers_codec = { path = "../routers_codec", version = "0.2.2", default-features = false, optional = true }

# Logging
log = { workspace = true }

# Error Handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Geography
geo = { workspace = true }
petgraph = { workspace = true }
# S2 cell hierarchy, behind the `s2` feature (see below).
s2 = { workspace = true, optional = true }

# Utilities
rustc-hash = { workspace = true }
rayon = { workspace = true, optional = true }
itertools = { workspace = true }

# CLI, for the `generate-shards` binary only (native).
clap = { workspace = true, features = ["derive", "env"], optional = true }
env_logger = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
postcard = { workspace = true }

# `web_time::Instant` is a `std::time::Instant` drop-in; std on every target
# except `wasm32-unknown-unknown` (browser), where it uses the JS clock.
web-time = "1"

# The browser fetcher (`WebFetcher`) uses `web-sys::fetch`. Behind the `web`
# feature so a component build (which drives fetching from the host) doesn't
# drag wasm-bindgen JS imports in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }

[features]
default = ["osm", "parallel", "s2"]
osm = ["dep:routers_codec", "routers_codec/osm"]

# Rebuild spatial indices across a rayon pool; off for single-threaded targets
# (wasm), where the two trees build in sequence.
parallel = ["dep:rayon", "routers_codec?/parallel"]

# The `S2Strategy` partitioner. Pulls in the `s2` crate (and through it
# `float_extras`, which binds the C maths library), so it is a feature the
# wasm build can leave off.
s2 = ["dep:s2"]

# The browser `window.fetch` shard fetcher (wasm-bindgen). Off for component
# builds, which take shard bytes from the host instead.
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

# The `generate-shards` binary.
cli = ["dep:clap", "dep:env_logger"]

[dev-dependencies]
routers_fixtures = { workspace = true }
routers_codec = { path = "../routers_codec", version = "0.2.2", features = ["osm"] }

wkt = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "generate-shards"
path = "bin/generate-shards.rs"
required-features = ["osm", "cli"]

[lints]
workspace = true
