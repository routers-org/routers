[package]
name = "routers_graph_poc"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Proof of concept: a compact, array-backed routing graph for Routers"
publish = false

[dependencies]
# No default features: the PoC must not inherit codec's global allocator.
routers_codec = { workspace = true, default-features = false, features = ["osm", "parallel"] }
routers_network = { workspace = true }

geo = { workspace = true }
petgraph = { workspace = true }
uom = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
routers_transition = { workspace = true }
routers_fixtures = { workspace = true }
wkt = { workspace = true }

[features]
# Install mimalloc as the global allocator (via codec), to compare against the
# system allocator the PoC otherwise runs on.
mimalloc = ["routers_codec/mimalloc"]

[lints]
workspace = true
