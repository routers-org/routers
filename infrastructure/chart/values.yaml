# Default values for routers-realtime. Namespace comes from `helm -n <ns>`.

# Region topology, rendered verbatim to TOML and mounted read-only into every
# orchestrator and matcher (field names are the binaries' catalog fields).
catalog:
  version: 1
  routing_version: 1
  regions:
      # graph must equal the --graph-version the shards were built with;
      # coverage cells are disjoint across regions, one <cell>.shard.rt each.
    - id: sydney
      graph: sydney-local
      coverage:
        - r3gq
        - r3gr
      overlap: []
      lanes: 1
      resource_class: cpu-8
      replicas:
        min: 1
        max: 8
      freshness_budget_ms: 30000

# Raw JetStream stream count the 1024 partitions divide across (wire law).
streams: 4

# Geohash cell precision; validated against the compiled event::SHARD_PRECISION.
shardPrecision: 4

# External dependencies; supply real URLs via an overlay (-f values-<env>.yaml).
infra:
  eventBus:
    url: ""
  kv:
    url: ""
  telemetry:
    otlpUrl: ""

# Registry prefix prepended to every image.repository; empty renders bare names.
image:
  registry: ""

imagePullSecrets: []

# Pod identity; `create` + the gcp-service-account annotation drive gcsfuse WI.
serviceAccount:
  create: false
  name: ""
  annotations: {}

# Source for the <cell>.shard.rt files and manifest.json mounted at /shards.
shardCache:
  mode: hostPath
  hostPath: /var/lib/routers/shards-cache
  pvc:
    claimName: routers-shards
  gcs:
    bucket: ""
    mountOptions: implicit-dirs,file-cache:max-size-mb:-1,metadata-cache:ttl-secs:-1

# One matcher Deployment per region, configured through args (no clap env).
# Capacity is authoritative in catalog.regions[].replicas; the chart derives
# the Deployment floor and, when min < max, its HPA bounds from that value.
matcher:
  image:
    repository: routers-matcher
    tag: latest
    pullPolicy: Never
  healthPort: 9091
  targetCPUUtilizationPercentage: 80
  rustLog: info
  # Empty keeps the binary default (one slot per core); else rendered as --slots.
  slots: ""
  # Bounds on the carried match state; 0 disables either cap.
  maxCandidates: 16
  windowLayers: 32
  extraArgs: []
  env: {}
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 1000m
      memory: 256Mi
    limits:
      memory: 3072Mi

# Vehicle-partitioned fleet; replicas must divide 1024 (StatefulSet ordinals).
orchestrator:
  image:
    repository: routers-orchestrator
    tag: latest
    pullPolicy: Never
  replicas: 4
  rustLog: info
  # Rendered verbatim; every flag has a clap UPPER_SNAKE env name (NATS, GAP, ...).
  env: {}
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      memory: 1024Mi

# Tails the committed-output plane and applies it to the kv served view.
materializer:
  enabled: true
  image:
    repository: routers-materializer
    tag: latest
    pullPolicy: Never
  replicas: 1
  consumerName: materializer
  # Empty tails the whole plane; a range like "0-511" narrows the filter.
  partitions: ""
  rustLog: info
  env: {}
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

grafanaDashboard:
  enabled: true
