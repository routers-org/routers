# The materializer tails the committed-output plane and applies every output to
# the Valkey served view idempotently. It is the one consumer that *is* the
# served history, and owns none of the orchestrator's state. Replicas that share
# `consumerName` share the durable consumer, so they divide the plane; a
# `partitions` range narrows the filter so a shard of materializers can split it.
{{- if .Values.materializer.enabled }}
{{- include "routers.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: materializer
  labels:
    {{- include "routers.labels" . | nindent 4 }}
    app: materializer
spec:
  replicas: {{ .Values.materializer.replicas }}
  selector:
    matchLabels:
      app: materializer
  template:
    metadata:
      labels:
        {{- include "routers.labels" . | nindent 8 }}
        app: materializer
    spec:
      {{- with (include "routers.podSpecCommon" (dict "root" $ "service" .Values.materializer) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: materializer
          image: {{ include "routers.image" (dict "registry" .Values.image.registry "image" .Values.materializer.image) | quote }}
          imagePullPolicy: {{ .Values.materializer.image.pullPolicy }}
          env:
            - name: NATS
              value: {{ .Values.infra.nats.url | quote }}
            - name: VALKEY
              value: {{ .Values.infra.valkey.url | quote }}
            - name: CONSUMER_NAME
              value: {{ .Values.materializer.consumerName | quote }}
            {{- if .Values.materializer.partitions }}
            # A range narrows the durable consumer's filter so this shard of
            # materializers owns only part of the output plane.
            - name: PARTITIONS
              value: {{ .Values.materializer.partitions | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.materializer.rustLog | quote }}
            {{- if .Values.infra.otlp.url }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.infra.otlp.url | quote }}
            {{- end }}
            {{- range $name, $value := .Values.materializer.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.materializer.resources | nindent 12 }}
{{- end }}
