# The region catalog: the map from geohash cells to the solve regions that own
# them, rendered verbatim from `.Values.catalog` into TOML and mounted read-only
# at /etc/routers/catalog.toml in every orchestrator and matcher pod. It is the
# single source of truth both binaries validate at startup, so a change here
# rolls those pods through the checksum annotation on their templates.
{{- include "routers.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-catalog
  labels:
    {{- include "routers.labels" . | nindent 4 }}
data:
  catalog.toml: |
{{ include "routers.catalog.toml" . | trim | indent 4 }}
