# The orchestrator fleet is vehicle-partitioned, not geographic: a
# StatefulSet whose pods each derive a disjoint slice of the 1024 vehicle
# partitions from their ordinal (POD_NAME + FLEET; see the binary's
# --pod-name/--fleet). Scaling the fleet re-slices the space, so change
# `orchestrator.replicas` with the fleet quiesced or accept a window of
# double-ownership — which revisions make wasteful, not wrong.
{{- include "routers.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels:
    {{- include "routers.labels" . | nindent 4 }}
    app: orchestrator
spec:
  clusterIP: None
  selector:
    app: orchestrator
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orchestrator
  labels:
    {{- include "routers.labels" . | nindent 4 }}
    app: orchestrator
spec:
  serviceName: orchestrator
  replicas: {{ .Values.orchestrator.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      annotations:
        # The orchestrator loads the catalog once at startup, so a mount change
        # only reaches it on a restart. Rolling the pods on the catalog's
        # checksum is what makes `helm upgrade` actually apply a new topology.
        checksum/catalog: {{ include "routers.catalog.toml" . | sha256sum }}
      labels:
        {{- include "routers.labels" . | nindent 8 }}
        app: orchestrator
    spec:
      {{- with (include "routers.podSpecCommon" (dict "root" $ "service" .Values.orchestrator) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: {{ include "routers.image" (dict "registry" .Values.image.registry "image" .Values.orchestrator.image) | quote }}
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}
          env:
            - name: NATS
              value: {{ .Values.infra.nats.url | quote }}
            - name: VALKEY
              value: {{ .Values.infra.valkey.url | quote }}
            - name: CATALOG
              value: "/etc/routers/catalog.toml"
            # The StatefulSet ordinal in POD_NAME, paired with FLEET, is what the
            # binary turns into this pod's disjoint partition slice.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FLEET
              value: {{ .Values.orchestrator.replicas | quote }}
            - name: STREAMS
              value: {{ .Values.streams | quote }}
            - name: RUST_LOG
              value: {{ .Values.orchestrator.rustLog | quote }}
            {{- if .Values.infra.otlp.url }}
            # Spans exported here become Prometheus series via the collector's
            # spanmetrics pipeline; unset, telemetry degrades to plain logs.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.infra.otlp.url | quote }}
            {{- end }}
            {{- range $name, $value := .Values.orchestrator.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: catalog
              mountPath: /etc/routers/catalog.toml
              subPath: catalog.toml
              readOnly: true
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      volumes:
        - name: catalog
          configMap:
            name: {{ .Release.Name }}-catalog
