# Vehicle-partitioned orchestrator fleet: a StatefulSet whose ordinals slice the 1024 partitions.
{{- include "routers.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels:
    {{- include "routers.labels" . | nindent 4 }}
    app: orchestrator
spec:
  clusterIP: None
  selector:
    app: orchestrator
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orchestrator
  labels:
    {{- include "routers.labels" . | nindent 4 }}
    app: orchestrator
spec:
  serviceName: orchestrator
  replicas: {{ .Values.orchestrator.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      annotations:
        checksum/catalog: {{ include "routers.catalog.toml" . | sha256sum }}
      labels:
        {{- include "routers.labels" . | nindent 8 }}
        app: orchestrator
    spec:
      {{- with (include "routers.podSpecCommon" (dict "root" $ "service" .Values.orchestrator) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: {{ include "routers.image" (dict "registry" .Values.image.registry "image" .Values.orchestrator.image) | quote }}
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}
          env:
            - name: NATS
              value: {{ .Values.infra.eventBus.url | quote }}
            - name: VALKEY
              value: {{ .Values.infra.kv.url | quote }}
            - name: CATALOG
              value: "/etc/routers/catalog.toml"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FLEET
              value: {{ .Values.orchestrator.replicas | quote }}
            - name: STREAMS
              value: {{ .Values.streams | quote }}
            - name: SHARDS
              value: {{ .Values.orchestrator.shards | quote }}
            - name: SHARD_QUEUE_CAPACITY
              value: {{ .Values.orchestrator.shardQueueCapacity | quote }}
            - name: RUST_LOG
              value: {{ .Values.orchestrator.rustLog | quote }}
            {{- if .Values.infra.telemetry.otlpUrl }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.infra.telemetry.otlpUrl | quote }}
            {{- end }}
            {{- range $name, $value := .Values.orchestrator.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: catalog
              mountPath: /etc/routers/catalog.toml
              subPath: catalog.toml
              readOnly: true
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      volumes:
        - name: catalog
          configMap:
            name: {{ .Release.Name }}-catalog
