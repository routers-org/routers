{{- if .Values.serviceAccount.create }}
{{- /* Pod identity; the gcp-service-account annotation drives gcsfuse Workload Identity. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "routers.serviceAccountName" . }}
  labels:
    {{- include "routers.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
