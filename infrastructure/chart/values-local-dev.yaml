# Local devstack: in-cluster infra in the routers-dev namespace, hostPath shards.
infra:
  eventBus:
    url: nats://nats.routers-dev.svc.cluster.local:4222
  kv:
    url: redis://valkey-primary.routers-dev.svc.cluster.local:6379
  telemetry:
    otlpUrl: http://otel-collector-opentelemetry-collector.routers-dev.svc.cluster.local:4318

shardCache:
  mode: hostPath
  # Overridden by the Justfile so a relative path resolves against the checkout.
  hostPath: ./target/shard_cache

matcher:
  rustLog: info

orchestrator:
  rustLog: info
  # One pod owns the whole partition space on a single-node devstack.
  replicas: 1

materializer:
  rustLog: info
