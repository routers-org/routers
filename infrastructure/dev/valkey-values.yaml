# Leave CPU uncapped to avoid throttling the hot command path. Full replays
# exceeded 780 MiB of stored state; AOF rewrite needs additional headroom.
auth:
  enabled: false

primary:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

replica:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi
