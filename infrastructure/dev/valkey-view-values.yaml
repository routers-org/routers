# The served view is rebuilt from committed NATS output and does not share the
# raw/checkpoint Valkey primary. Keep both primaries uncapped on the dev node.
architecture: standalone
auth:
  enabled: false
image:
  registry: docker.io
  repository: bitnamilegacy/valkey
  tag: 8.1.1-debian-12-r0
metrics:
  enabled: true
  serviceMonitor:
    enabled: true

primary:
  extraFlags:
    - --io-threads
    - "6"
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi

replica:
  replicaCount: 0
