name: Automated Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROTOC_VERSION: 3.20.3
  BUFFA_VERSION: 0.8.1
  CARGO_TERM_COLOR: always
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      wasm: ${{ steps.wasm.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Packager
        run: |
          cargo install --locked \
            protoc-gen-buffa-packaging@${{ env.BUFFA_VERSION }}

      - name: Generate Schema
        run: |
          buf generate

      - name: Run release-plz
        uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Resolve current version
        id: version
        run: |
          set -euo pipefail

          git fetch --tags --force --quiet
          TAG=$(git tag --list 'routers-v*' --sort=-v:refname | head -n1)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Current version: ${TAG:-none}"

      - name: Resolve unpublished wasm packages
        id: wasm
        run: |
          set -euo pipefail

          declare -A npm=([routers_wasm]=@routers-org/router [routers_tz_wasm]=@routers-org/timezone)
          packages='[]'
          for crate in "${!npm[@]}"; do
            tag=$(git tag --list "$crate-v*" --sort=-v:refname | head -n1)
            if [ -z "$tag" ]; then
              echo "$crate: not tagged yet."
              continue
            fi

            version="${tag#"$crate"-v}"
            name=$(git show "$tag:libs/$crate/package.json" 2>/dev/null | jq -r '.name // empty' || true)
            if [ "$name" != "${npm[$crate]}" ]; then
              echo "$tag packages '${name:-nothing}', not ${npm[$crate]}; skipping."
            elif npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, nothing to do."
            else
              echo "$name@$version not found, publishing."
              packages=$(jq -c --arg crate "$crate" --arg tag "$tag" --arg version "$version" \
                --arg npm "$name" '. + [$ARGS.named]' <<< "$packages")
            fi
          done

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build-containers:
    name: Build and push containers
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - name: orchestrator
            file: infrastructure/orchestrator/Dockerfile
          - name: matcher
            file: infrastructure/matcher/Dockerfile
          - name: materializer
            file: infrastructure/materializer/Dockerfile
          - name: timezone
            file: infrastructure/timezone/Dockerfile
      fail-fast: false
    env:
      IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/routers-${{ matrix.name }}
      TAG: ${{ needs.release-plz-release.outputs.tag }}
    steps:
      # Must precede authentication: checkout cleans the workspace that the
      # credential file is written into.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          lfs: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Check whether ${{ matrix.name }} exists at ${{ needs.release-plz-release.outputs.tag }}
        id: check
        run: |
          set -euo pipefail

          if gcloud artifacts docker tags list "$IMAGE" --format='value(tag)' | grep -Fxq "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG not found, building."
          fi

      - name: Install protoc
        if: steps.check.outputs.exists == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Buf
        if: steps.check.outputs.exists == 'false'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Packager
        if: steps.check.outputs.exists == 'false'
        run: |
          cargo install --locked \
            protoc-gen-buffa-packaging@${{ env.BUFFA_VERSION }}

      - name: Generate Schema
        if: steps.check.outputs.exists == 'false'
        run: buf generate

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Configure Docker for Artifact Registry
        if: steps.check.outputs.exists == 'false'
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push ${{ matrix.name }}
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.TAG }}

  build-wasm:
    name: Publish ${{ matrix.package.npm }}
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: needs.release-plz-release.outputs.wasm != '' && needs.release-plz-release.outputs.wasm != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-plz-release.outputs.wasm) }}
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ matrix.package.tag }}
      CRATE: ${{ matrix.package.crate }}
      JCO: pnpm dlx @bytecodealliance/jco@1.32
    defaults:
      run:
        working-directory: libs/${{ matrix.package.crate }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          lfs: true

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Rust toolchain (wasm32-wasip2)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: libs/${{ matrix.package.crate }}/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install Packager
        run: |
          cargo install --locked \
            protoc-gen-buffa-packaging@${{ env.BUFFA_VERSION }}

      - name: Generate Schema
        working-directory: .
        run: buf generate

      - name: Build component
        run: cargo build --release -p "$CRATE" --target wasm32-wasip2

      - name: Optimise component (wasm-opt -Oz)
        run: |
          $JCO opt "../../target/wasm32-wasip2/release/$CRATE.wasm" \
            -o "$TAG.component.wasm" -- -Oz

      - name: Transpile to JS
        run: $JCO transpile "$TAG.component.wasm" --name "$CRATE" -o dist/transpiled

      - name: Smoke-test package
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$TAG.component.wasm" --clobber

      - name: Update Package Version
        env:
          VERSION: ${{ matrix.package.version }}
        run: npm pkg set version="$VERSION"

      - name: Publish ${{ matrix.package.npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --no-git-checks

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Packager
        run: |
          cargo install --locked \
            protoc-gen-buffa-packaging@${{ env.BUFFA_VERSION }}

      - name: Generate Schema
        run: |
          buf generate

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The chart is versioned with the release and pushed beside the images, so
  # routers-org/infrastructure pins one tag for both.
  publish-chart:
    name: Publish the Helm chart
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release-plz-release.outputs.tag }}
      CHART: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/charts/routers-realtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # Immutable tags: a version that exists is left alone rather than re-pushed.
      - name: Package and push
        run: |
          set -euo pipefail

          VERSION="${TAG#routers-v}"
          if gcloud artifacts docker tags list "$CHART" --format='value(tag)' 2>/dev/null | grep -Fxq "$VERSION"; then
            echo "$CHART:$VERSION already exists, nothing to do."
            exit 0
          fi

          gcloud auth print-access-token \
            | helm registry login -u oauth2accesstoken --password-stdin "$GAR_LOCATION-docker.pkg.dev"
          helm package infrastructure/chart --version "$VERSION" --app-version "$VERSION" -d /tmp
          helm push "/tmp/routers-realtime-$VERSION.tgz" "oci://$GAR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/charts"
