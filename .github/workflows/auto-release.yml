name: Automated Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROTOC_VERSION: 3.20.3
  CARGO_TERM_COLOR: always
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Packager
        run: |
          cargo install --locked protoc-gen-buffa-packaging

      - name: Generate Schema
        run: |
          buf generate

      - name: Run release-plz
        uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Resolve current version
        id: version
        run: |
          set -euo pipefail

          git fetch --tags --force --quiet
          TAG=$(git tag --list 'routers-v*' --sort=-v:refname | head -n1)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Current version: ${TAG:-none}"

  build-containers:
    name: Build and push containers
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - name: orchestrator
            file: infrastructure/orchestrator/Dockerfile
          - name: matcher
            file: infrastructure/matcher/Dockerfile
          - name: materializer
            file: infrastructure/materializer/Dockerfile
          - name: timezone
            file: infrastructure/timezone/Dockerfile
      fail-fast: false
    env:
      IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/routers-${{ matrix.name }}
      TAG: ${{ needs.release-plz-release.outputs.tag }}
    steps:
      # Must precede authentication: checkout cleans the workspace that the
      # credential file is written into.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          lfs: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Check whether ${{ matrix.name }} exists at ${{ needs.release-plz-release.outputs.tag }}
        id: check
        run: |
          set -euo pipefail

          if gcloud artifacts docker tags list "$IMAGE" --format='value(tag)' | grep -Fxq "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG not found, building."
          fi

      - name: Install protoc
        if: steps.check.outputs.exists == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Buf
        if: steps.check.outputs.exists == 'false'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Packager
        if: steps.check.outputs.exists == 'false'
        run: cargo install --locked protoc-gen-buffa-packaging

      - name: Generate Schema
        if: steps.check.outputs.exists == 'false'
        run: buf generate

      - name: Configure Docker for Artifact Registry
        if: steps.check.outputs.exists == 'false'
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push ${{ matrix.name }}
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.TAG }}

  build-wasm:
    name: Build wasm component artifact
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release-plz-release.outputs.tag }}
      JCO: pnpm dlx @bytecodealliance/jco@1.32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Rust toolchain (wasm32-wasip2)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: libs/routers_wasm/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install Packager
        run: cargo install --locked protoc-gen-buffa-packaging

      - name: Generate Schema
        run: buf generate

      - name: Build component
        run: cargo build --release -p routers_wasm --target wasm32-wasip2

      - name: Optimise component (wasm-opt -Oz)
        run: |
          $JCO opt target/wasm32-wasip2/release/routers_wasm.wasm \
            -o "routers_wasm-${TAG}.component.wasm" -- -Oz

      - name: Attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "routers_wasm-${TAG}.component.wasm" --clobber

      - name: Transpile to JS
        run: |
          $JCO transpile "routers_wasm-${TAG}.component.wasm" \
            --name routers_wasm -o libs/routers_wasm/dist/transpiled

      - name: Smoke-test package
        working-directory: libs/routers_wasm
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Resolve package version
        id: versioning
        working-directory: libs/routers_wasm
        run: |
          set -euo pipefail

          VERSION="${TAG#routers-v}"
          NAME=$(npm pkg get name | tr -d '"')

          if npm view "$NAME@$VERSION" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already published, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION not found, publishing."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Package Version
        if: steps.versioning.outputs.exists == 'false'
        working-directory: libs/routers_wasm
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Publish @routers-org/wasm
        if: steps.versioning.outputs.exists == 'false'
        working-directory: libs/routers_wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --no-git-checks

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The chart is versioned with the release and pushed beside the images, so
  # routers-org/infrastructure pins one tag for both.
  publish-chart:
    name: Publish the Helm chart
    runs-on: ubuntu-latest
    needs: release-plz-release
    if: needs.release-plz-release.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release-plz-release.outputs.tag }}
      CHART: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/charts/routers-realtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # Immutable tags: a version that exists is left alone rather than re-pushed.
      - name: Package and push
        run: |
          set -euo pipefail

          VERSION="${TAG#routers-v}"
          if gcloud artifacts docker tags list "$CHART" --format='value(tag)' 2>/dev/null | grep -Fxq "$VERSION"; then
            echo "$CHART:$VERSION already exists, nothing to do."
            exit 0
          fi

          gcloud auth print-access-token \
            | helm registry login -u oauth2accesstoken --password-stdin "$GAR_LOCATION-docker.pkg.dev"
          helm package infrastructure/chart --version "$VERSION" --app-version "$VERSION" -d /tmp
          helm push "/tmp/routers-realtime-$VERSION.tgz" "oci://$GAR_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/charts"
