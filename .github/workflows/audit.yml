name: Security audit
on:
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --workspace: the root manifest is also a package, so without it only `routers` is checked.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --workspace --all-features
