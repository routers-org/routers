name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROTOC_VERSION: 3.20.3
  # Keep in step with the `buffa` workspace dependency and flake.nix.
  BUFFA_VERSION: 0.6.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Package verification compares the PR's two merge parents below.
          fetch-depth: 2
          lfs: true

      - name: install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Caches are branch-scoped, so only `main` writes one for PRs to restore.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache packaging plugin
        id: packager-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo-tools
          key: buffa-packaging-${{ runner.os }}-${{ runner.arch }}-${{ env.BUFFA_VERSION }}

      - name: Install Packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --root ~/.cargo-tools \
            protoc-gen-buffa-packaging@${{ env.BUFFA_VERSION }}

      - name: Put packaging plugin on PATH
        run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      - name: Generate Schema
        run: |
          buf generate

      - name: 📦 Verify packages against published dependencies
        if: github.event_name == 'pull_request'
        run: |
          if git diff --unified=0 HEAD^1 HEAD^2 -- Cargo.toml ':(glob)**/Cargo.toml' \
            | grep -Eq '^[+-]version = "[0-9]'; then
            echo "Package versions changed; release verification will validate them after publication."
            exit 0
          fi

          cargo package --workspace \
            --exclude routers-conformance \
            --exclude routers_fixtures \
            --exclude routers_viewer \
            --allow-dirty

      - name: 🧪 Test
        # Excluded crates have no tests; remove from this list when they gain some.
        run: >
          cargo nextest run --workspace
          --exclude routers-conformance
          --exclude routers_tiles
          --exclude routers_rpc
          --exclude routers_geo
          --exclude routers_tz_types
