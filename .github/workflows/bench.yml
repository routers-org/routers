name: Benchmark

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROTOC_VERSION: 3.20.3
  # Keep in step with the `buffa` workspace dependency and flake.nix.
  BUFFA_VERSION: 0.6.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: codspeed-macro

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}

      - name: Install Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Toolchain, Cache and Codspeed
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache: false
          bins: cargo-codspeed

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Caches are branch-scoped, so only `main` writes one for PRs to restore.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache packaging plugin
        id: packager-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo-tools
          key: buffa-packaging-${{ runner.os }}-${{ runner.arch }}-${{ env.BUFFA_VERSION }}

      - name: Install Packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --root ~/.cargo-tools \
            protoc-gen-buffa-packaging@${{ env.BUFFA_VERSION }}

      - name: Put packaging plugin on PATH
        run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      - name: Generate Schema
        run: |
          buf generate

      # `routers_viewer` has no benches; excluding it drops the whole GUI stack.
      - name: 🔨Build (workspace)
        run: cargo codspeed build --workspace --exclude routers_viewer
        env:
          # Fat LTO can run several memory-heavy links concurrently on the
          # 16-core CodSpeed runner, so leave enough RAM headroom for each one.
          CARGO_BUILD_JOBS: 4

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v3
        with:
          run: INSTA_UPDATE=always cargo codspeed run --workspace --exclude routers_viewer
          token: ${{ secrets.CODSPEED_TOKEN }}

      - name: Check for snapshot drift
        run: |
          if ! git diff --quiet benches/snapshots/; then
            echo "Benchmark snapshots changed. Run 'just bench' locally and commit the updated files."
            echo "Changed files:"
            git diff --stat benches/snapshots/
            exit 1
          fi
        env:
          GIT_LFS_SKIP_SMUDGE: 0
